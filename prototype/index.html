<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4ef">
  <title>Fold · 林苒的事项回放</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232c4c3b'/%3E%3Cpath d='M11 10h19L20 20v11h-9z' fill='%23ececdf'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (['a', 'b', 'c'].includes(new URLSearchParams(location.search).get('variant')?.toLowerCase())) {
      document.documentElement.classList.add('opening-exploration');
    }
  </script>
  <style>.opening-exploration .app-shell { display: none; }</style>
</head>
<body>
<a class="skip-link" href="#workspace">跳到事项概览</a>
<div class="app-shell">
  <header class="masthead">
    <a class="brand" href="./" aria-label="Fold 事项回放首页"><svg width="27" height="29" viewBox="0 0 27 29" aria-hidden="true"><path d="M2 2h23L14 13v14H2Z" fill="currentColor"/><path d="m14 2 11 0-11 11Z" fill="currentColor" opacity=".35"/></svg><span>Fold</span><span class="masthead-caption">事项回放</span></a>
    <div class="header-actions"><span class="prototype-badge">交互原型</span><button id="story-button" aria-expanded="false" aria-controls="story-drawer">演示说明</button><button id="full-state-button" title="查看此刻完整 state JSON">完整 state <span aria-hidden="true">↗</span></button></div>
  </header>
  <section class="story-drawer" id="story-drawer" hidden></section>
  <section class="story-header">
    <div class="story-heading"><span class="eyebrow">事项变化 · 两周回放</span><h1>林苒的事项回放</h1><p id="story-subtitle">查看事项、原始依据与两周内的状态变化。</p></div>
    <div class="story-meta" id="story-meta"></div>
  </section>
  <main class="main-grid">
    <aside class="inputs-panel" aria-label="本轮原始输入">
      <div class="panel-heading"><h2 id="inputs-heading">本轮原始输入</h2><span id="event-count"></span></div>
      <div class="input-tabs"><button id="all-events" class="is-active" aria-pressed="true">全部输入</button><button id="used-events" aria-pressed="false">已采用</button><button id="batch-button">Batch <span aria-hidden="true">↗</span></button></div>
      <div class="event-list" id="event-list"></div>
      <div class="input-footnote">输入不自动占用份额<br>重复、噪音和暂缓消息均保留。</div>
    </aside>
    <section class="workspace" id="workspace" aria-label="当前事项概览">
      <div class="workspace-toolbar"><nav class="breadcrumbs" id="breadcrumbs" aria-label="事项层级"></nav><div class="view-actions"><button id="replay-motion" disabled title="重播刚才的份额与布局变化"><span aria-hidden="true">↻</span> 重播过渡</button><button id="slow-motion" aria-pressed="false" title="放慢过渡动画，便于看清去向">慢动作</button><button id="compare-button" aria-pressed="false"><span aria-hidden="true">⇄</span> 对比状态</button></div></div>
      <div class="frame-heading"><div><div class="frame-date" id="frame-date"></div><h2 id="frame-title"></h2></div><span class="revision-tag" id="revision-tag"></span></div>
      <div class="agent-note"><span class="note-label">本轮整理依据</span><p id="agent-note"></p></div>
      <nav class="cold-start-progress" id="cold-start-progress" aria-label="初始整理步骤" hidden></nav>
      <div id="compare-controls" class="compare-controls" hidden><label>从 <select id="base-select" aria-label="对比基线时刻"></select></label><span aria-hidden="true">→</span><label>到 <select id="target-select" aria-label="对比当前时刻"></select></label><button id="close-compare" aria-label="关闭状态对比">×</button></div>
      <div class="board-heading"><span id="layer-title">全部关注事项</span><span id="budget-label"></span></div>
      <div class="boards-wrap" id="boards-wrap"><div class="board-column" id="base-column" hidden><div class="board-label" id="base-label"></div><div class="pinboard" id="base-board" aria-label="基线 Pinboard"></div></div><div class="board-column"><div class="board-label" id="current-label" hidden></div><div class="pinboard" id="current-board" aria-label="当前 Pinboard"></div></div></div>
      <div class="board-legend"><span><i class="legend-area" aria-hidden="true"></i>面积 = 份额</span><span><i class="legend-blank" aria-hidden="true"></i>留白 = 未分配</span><span id="board-hint">点击查看详情 · 有子项可进入下一层</span></div>
      <div class="compact-items" id="compact-items" aria-label="所有当前条目"></div>
      <section class="diff-summary" id="diff-summary" hidden></section>
      <p class="overview-reminder">概览帮助定位。完整 state 保留所有条目、字段与反馈。</p>
    </section>
    <aside class="inspector" aria-label="事项详情与原始数据">
      <div class="inspector-top"><span class="eyebrow" id="inspector-eyebrow">当前状态</span><button id="close-detail" aria-label="返回状态概览" title="返回状态概览">↶</button></div>
      <h2 id="inspector-title" tabindex="-1">本轮状态概览</h2>
      <div class="detail-tabs" role="tablist" aria-label="内容呈现方式"><button id="detail-tab" role="tab" aria-selected="true" class="is-active">详情</button><button id="json-tab" role="tab" aria-selected="false">原始 JSON</button><button id="copy-json" title="复制当前检查对象的 JSON" aria-label="复制 JSON">⧉</button></div>
      <div class="inspector-body" id="inspector-body" role="tabpanel"></div>
    </aside>
  </main>
  <footer class="transport" aria-label="事项回放控制">
    <div class="transport-main"><div class="playback-controls"><button id="previous-frame" aria-label="上一帧" title="上一帧（←）">‹</button><button id="play-button" class="play-button" aria-label="开始回放" title="播放 / 暂停（空格）"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m6 3 11 7-11 7Z" fill="currentColor"/></svg><span>播放</span></button><button id="next-frame" aria-label="下一帧" title="下一帧（→）">›</button></div><div class="time-readout"><strong id="cursor-date"></strong><span id="cursor-time"></span><span class="between-note" id="between-note"></span></div><div class="playback-options"><span id="frame-count"></span><label class="speed-label">速度 <select id="playback-speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="restart-button" title="从头开始">↺</button></div></div>
    <div class="timeline-track"><div class="timeline-markers" id="timeline-markers"></div><input type="range" class="time-slider" id="time-slider" aria-label="拖动时间查看此刻状态"><div class="day-labels" id="day-labels"></div></div>
    <nav class="chapter-list" id="chapter-list" aria-label="日期与主题导航"></nav>
  </footer>
  <div class="prototype-note"><span>演示人物与私人消息均为创作；公共事实附原始来源。</span><span>← → 逐帧 · 空格播放 · Esc 返回上层</span></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript>这个交互原型需要启用 JavaScript。</noscript>
<script type="module">
  const variant = new URLSearchParams(location.search).get('variant')?.toLowerCase();
  await import(['a', 'b', 'c'].includes(variant) ? './explore.mjs?v=liquid-calm-1' : './app.mjs?v=direct-titles-1');
</script>
</body>
</html>
